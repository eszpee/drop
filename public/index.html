<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Send files</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/uppy.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="shell">
  <header class="hero">
    <div class="mark" aria-hidden="true">↓</div>
    <h1>Send files to <span id="owner">me</span></h1>
    <p class="muted">Drop them below, or anywhere on this page. Large files are fine, and if your
      connection drops the upload picks up where it left off.</p>
  </header>

  <section id="uploader" class="uploader" aria-label="File upload"></section>

  <section id="done" class="card center" hidden>
    <div class="mark ok" aria-hidden="true">✓</div>
    <h1>Sent</h1>
    <p class="muted" id="done-text">Your files arrived. Nothing else to do.</p>
    <button class="btn ghost" id="again" type="button">Send more files</button>
  </section>

  <section id="closed" class="card center" hidden>
    <div class="mark" aria-hidden="true">⏸</div>
    <h1>Not accepting files right now</h1>
    <p class="muted">Please try again a bit later.</p>
  </section>

  <p class="foot muted small" id="limits"></p>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
